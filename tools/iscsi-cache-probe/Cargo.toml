[package]
name = "superhdd-iscsi-probe"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
cache-core = { package = "superhdd-cache-core", path = "../../crates/cache-core" }
serde_json = "1"
superhdd-storage-control = { path = "../../crates/storage-control" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_IO", "Win32_System_Ioctl"] }
