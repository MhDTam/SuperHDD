[workspace]
resolver = "2"
members = ["crates/cache-core", "crates/platform", "crates/storage-control", "services/superhdd-service", "apps/desktop/src-tauri"]
default-members = ["crates/cache-core", "crates/platform", "services/superhdd-service"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
