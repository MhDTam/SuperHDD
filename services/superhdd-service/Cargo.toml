[package]
name = "superhdd-service"
version.workspace = true
edition.workspace = true

[[bin]]
name = "SuperHDDService"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
superhdd-platform = { path = "../../crates/platform" }
superhdd-storage-control = { path = "../../crates/storage-control" }

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows-sys = { version="0.61",features=["Win32_Foundation","Win32_Security","Win32_Storage_FileSystem","Win32_System_Threading","Win32_System_Services","Win32_System_Com"] }
